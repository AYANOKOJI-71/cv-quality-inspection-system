[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "visionline-quality-inspection"
version = "1.0.0"
description = "A local-first computer-vision quality-inspection portfolio system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "python-multipart>=0.0.18,<1",
  "pydantic>=2.10,<3",
  "numpy>=2.1,<3",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=11,<12",
  "torch>=2.5,<3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/api/src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.setuptools.packages.find]
where = ["apps/api/src"]
